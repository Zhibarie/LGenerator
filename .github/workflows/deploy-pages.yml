name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Verify essential files exist
        run: |
          # Sanity check — refuse deploy if critical files missing
          set -e
          for f in index.html assets/js/app.js assets/css/base.css; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing critical file: $f"
              exit 1
            fi
          done
          echo "✓ All critical files present"

      - name: Verify ES module imports resolve
        run: |
          # Quick static check: every import statement must point to a file that exists.
          # This catches broken module paths before deploy.
          set -e
          for js in $(find assets/js -name '*.js'); do
            while IFS= read -r line; do
              # Extract the path from `import ... from './foo.js'` or `import './foo.js'`
              path=$(echo "$line" | grep -oE "from '[^']+'" | sed -E "s/from '//;s/'//")
              if [ -z "$path" ]; then
                path=$(echo "$line" | grep -oE "import '[^']+'" | sed -E "s/import '//;s/'//")
              fi
              if [ -z "$path" ]; then continue; fi
              # Resolve relative to current file's directory
              dir=$(dirname "$js")
              resolved="$dir/$path"
              if [ ! -f "$resolved" ]; then
                echo "❌ $js imports missing: $path (resolved: $resolved)"
                exit 1
              fi
            done < <(grep -E "^import|^}.*from|^[a-zA-Z].*from" "$js" || true)
          done
          echo "✓ All ES module imports resolve"

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
