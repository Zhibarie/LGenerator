<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>LGenerator — Test Runner</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #eee; max-width: 900px; margin: 0 auto; }
    h1 { color: #facc15; border-bottom: 1px solid #444; padding-bottom: 8px; }
    h2 { color: #3b82f6; margin-top: 24px; }
    .suite { background: #222; padding: 12px; border-radius: 6px; margin: 8px 0; }
    .summary { padding: 12px; border-radius: 6px; margin-top: 12px; font-weight: bold; }
    .summary.pass { background: #22c55e22; color: #86efac; }
    .summary.fail { background: #ef444422; color: #fca5a5; }
    .errors { background: #2a1a1a; padding: 8px; border-radius: 4px; margin-top: 8px; font-size: 12px; }
    button { padding: 8px 16px; margin: 4px; cursor: pointer; background: #c0392b; color: white; border: none; border-radius: 4px; }
    button:hover { background: #a93226; }
  </style>
</head>
<body>
  <h1>LGenerator Test Runner</h1>
  <p>Klik tombol di bawah untuk menjalankan test suite.</p>

  <button onclick="runAll()">Run All Tests</button>
  <button onclick="runOne('storage')">Storage</button>
  <button onclick="runOne('sanitizer')">Sanitizer</button>
  <button onclick="runOne('attachment')">Attachment</button>
  <button onclick="runOne('auto-fit')">Auto-Fit</button>
  <button onclick="runOne('pdf')">PDF</button>

  <div id="results"></div>

  <script type="module">
    import { runStorageTests } from './storage.test.js';
    import { runSanitizerTests } from './sanitizer.test.js';
    import { runAttachmentTests } from './attachment.test.js';
    import { runAutoFitTests } from './auto-fit.test.js';
    import { runPdfTests } from './pdf.test.js';

    const runners = {
      'storage': runStorageTests,
      'sanitizer': runSanitizerTests,
      'attachment': runAttachmentTests,
      'auto-fit': runAutoFitTests,
      'pdf': runPdfTests,
    };

    window.runOne = async (name) => {
      const el = document.getElementById('results');
      const runner = runners[name];
      if (!runner) { alert('Unknown suite: ' + name); return; }
      el.innerHTML += `<div class="suite"><h2>${name}</h2><pre id="out-${name}"></pre></div>`;
      console.group(name);
      const r = await runner();
      console.groupEnd();
      const out = document.getElementById('out-' + name);
      const summary = r.failed === 0
        ? `<div class="summary pass">✓ ${r.passed} passed</div>`
        : `<div class="summary fail">✗ ${r.passed} passed, ${r.failed} failed</div>
           <div class="errors">${r.errors.map(e => `<b>${e.name}</b>: ${e.error}`).join('<br>')}</div>`;
      out.innerHTML = summary;
    };

    window.runAll = async () => {
      document.getElementById('results').innerHTML = '';
      for (const name of Object.keys(runners)) {
        await window.runOne(name);
      }
    };
  </script>
</body>
</html>
